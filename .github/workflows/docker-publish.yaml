name: Build & Publish Docker image

on:
  workflow_dispatch:
    inputs:
      comictagger_version:
        description: "ComicTagger version to install and tag (e.g., 1.6.0b6)"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GHCR using GITHUB_TOKEN
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            COMICTAGGER_VERSION=${{ inputs.comictagger_version }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/comictagger:latest
            ghcr.io/${{ github.repository_owner }}/comictagger:${{ inputs.comictagger_version }}
